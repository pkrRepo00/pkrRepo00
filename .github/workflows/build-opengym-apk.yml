name: Build openGym Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-opengym-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout openGym v1.4.1 source
        uses: actions/checkout@v4
        with:
          repository: DuarteSantos8/openGym
          ref: v1.4.1
          path: openGym

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openGym/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: openGym/frontend
        run: npm ci

      - name: Build mobile web bundle and sync Capacitor
        working-directory: openGym/frontend
        run: npm run build:mobile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Build debug APK
        working-directory: openGym/frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK and compute checksum
        working-directory: openGym/frontend/android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee app-debug.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: openGym-1.4.1-debug-apk
          path: |
            openGym/frontend/android/app/build/outputs/apk/debug/app-debug.apk
            openGym/frontend/android/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
